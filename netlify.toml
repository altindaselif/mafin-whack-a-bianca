# Depoyu Netlify'a bağlayınca kullanılacak ayarlar.
# Vite projesi: önce derleniyor, sonra dist klasörü yayınlanıyor.
[build]
  command = "npm run build"
  publish = "dist"

# Vite, VITE_ ile başlayan değişkenleri bilerek tarayıcı paketine gömüyor;
# Firebase'in web ayarları da zaten herkese açık değerler. Korumayı App Check,
# reCAPTCHA ve veritabanı kuralları sağlıyor. Bu yüzden Netlify'ın gizli anahtar
# taraması bu dokuz anahtarı görünce derlemeyi durdurmasın diye listeleniyorlar.
# Tarama kapatılmıyor: listede olmayan gerçek bir sır çıkarsa derleme yine durur.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_DATABASE_URL,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_RECAPTCHA_SITE_KEY"
